name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Quick tests (${{ matrix.platform }}, py${{ matrix.python-version }})
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and CLI test dependencies
        run: |
          pip install uv
          uv venv
          uv pip install -e ".[dev,cli]"

      - name: Run tests (excluding full_test.py)
        run: uv run pytest --ignore=tests/full_test.py

  no-cli-extra:
    name: CLI without optional I/O dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install base and development dependencies
        run: |
          pip install uv
          uv venv
          uv pip install -e ".[dev]"

      - name: Test commands without bibliography-io
        run: BIB_DEDUPE_EXPECT_NO_BIBLIOGRAPHY_IO=1 uv run pytest -q tests/cli_optional_test.py

  full-test:
    name: Full test (${{ matrix.platform }}, py${{ matrix.python-version }})
    needs: test
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and development dependencies
        run: |
          pip install uv
          uv venv
          uv pip install -e ".[dev]"

      - name: Run full_test.py
        run: uv run pytest -q tests/full_test.py
